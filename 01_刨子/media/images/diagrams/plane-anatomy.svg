<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">刨子的结构组成图</title>
  <desc id="desc">标注刨身、刨铁、刨口、底面、固定机构和刃口等关键结构。</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ed; }
      .title { font: 700 42px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #59666b; }
      .label { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .note { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #59666b; }
      .plane { fill: #9bb0a5; stroke: #455a64; stroke-width: 4; }
      .blade { fill: #d9dfe3; stroke: #53656d; stroke-width: 4; }
      .wedge { fill: #b78b5d; stroke: #6d4c2f; stroke-width: 4; }
      .sole { stroke: #263238; stroke-width: 7; stroke-linecap: round; }
      .mouth { fill: #2f3d43; }
      .edge { fill: #be6f43; }
      .callout { stroke: #be6f43; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .box { fill: #fffdf8; stroke: #d8ccb7; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#be6f43"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="70" y="76">刨子的结构组成</text>
  <text class="subtitle" x="70" y="114">理解结构，才能理解为什么调刃、刨口和底面会影响刨削效果。</text>

  <!-- Main plane cross-section -->
  <path class="plane" d="M255 520 L1040 520 L1125 610 L190 610 Z"/>
  <path class="plane" d="M285 395 L895 395 Q980 405 1035 520 L255 520 Q265 455 285 395 Z"/>
  <line class="sole" x1="190" y1="610" x2="1125" y2="610"/>
  <path class="mouth" d="M642 610 L725 610 L700 548 L663 548 Z"/>
  <path class="blade" d="M610 265 L710 265 L740 610 L640 610 Z"/>
  <path class="edge" d="M640 610 L740 610 L724 638 L624 638 Z"/>
  <path class="wedge" d="M475 330 L600 330 L648 520 L535 520 Z"/>
  <circle cx="855" cy="455" r="36" fill="#6f847b" stroke="#455a64" stroke-width="4"/>
  <rect x="808" y="430" width="95" height="50" rx="20" fill="#7f968c" stroke="#455a64" stroke-width="4"/>

  <!-- Label boxes -->
  <rect class="box" x="80" y="205" width="250" height="78" rx="8"/>
  <text class="label" x="105" y="238">刨身</text>
  <text class="note" x="105" y="266">导向、握持、稳定基准</text>
  <path class="callout" d="M330 245 C390 270 420 350 370 430"/>

  <rect class="box" x="760" y="170" width="255" height="78" rx="8"/>
  <text class="label" x="785" y="203">刨铁</text>
  <text class="note" x="785" y="231">真正切削木材的刀片</text>
  <path class="callout" d="M760 220 C720 235 700 250 675 270"/>

  <rect class="box" x="1040" y="290" width="265" height="78" rx="8"/>
  <text class="label" x="1065" y="323">固定机构</text>
  <text class="note" x="1065" y="351">压住刨铁，减少震动</text>
  <path class="callout" d="M1040 335 C980 365 925 410 890 448"/>

  <rect class="box" x="1020" y="655" width="270" height="78" rx="8"/>
  <text class="label" x="1045" y="688">底面</text>
  <text class="note" x="1045" y="716">决定接触和导向方式</text>
  <path class="callout" d="M1020 690 C960 650 965 620 1015 610"/>

  <rect class="box" x="525" y="665" width="255" height="78" rx="8"/>
  <text class="label" x="550" y="698">刨口</text>
  <text class="note" x="550" y="726">排屑，也控制撕裂</text>
  <path class="callout" d="M635 665 C650 645 660 628 670 610"/>

  <rect class="box" x="165" y="665" width="270" height="78" rx="8"/>
  <text class="label" x="190" y="698">刃口</text>
  <text class="note" x="190" y="726">锋利度决定表面质量</text>
  <path class="callout" d="M435 700 C520 700 570 655 635 625"/>

  <text class="note" x="70" y="790">调校时先看刃口，再看伸出量、左右平衡、刨口和底面贴合。</text>
</svg>

